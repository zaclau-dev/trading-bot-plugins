interface:
  display_name: "Trading Bot"
  short_description: "Trade safely and recover interrupted MCP connections"
  default_prompt: "Use $use-trading-bot to restore my Trading Bot connection after restarting the local service."

dependencies:
  tools:
    - type: "mcp"
      value: "trading-bot"
      description: "Hosted project-adapter preview and execution service"
      transport: "streamable_http"
      url: "http://localhost:3000/mcp"

policy:
  allow_implicit_invocation: true
