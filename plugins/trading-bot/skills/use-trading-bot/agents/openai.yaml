interface:
  display_name: "Trading Bot"
  short_description: "Preview and execute guarded onchain actions"
  default_prompt: "Use $use-trading-bot to show the supported projects and preview a guarded action without executing it."

dependencies:
  tools:
    - type: "mcp"
      value: "trading-bot"
      description: "Hosted project-adapter preview and execution service"
      transport: "streamable_http"
      url: "https://trading-bot-five-pink.vercel.app/mcp"

policy:
  allow_implicit_invocation: true
